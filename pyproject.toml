[project]
name = "arkham-mcp"
version = "0.1.0"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastmcp>=2.0",
    "aiohttp>=3.9",
    "pydantic-settings>=2.0",
    "patchright>=1.58",
    "playwright>=1.58",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
arkham-mcp = "arkham_mcp.server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkham_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: integration tests hitting real Arkham API"]
addopts = ["--ignore=tests/integrations"]

[tool.coverage.run]
source = ["src/arkham_mcp"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
